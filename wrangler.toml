name = "wf-pundit-news-automation-test"
main = "news-automation/worker.js"
compatibility_date = "2026-11-23"

[triggers]
crons = ["*/15 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "wfpundit-news-test-db"
database_id = "90bee875-0b6a-4cd4-b824-214f8c1eb6c9"
[observability]
enabled = true
head_sampling_rate = 1
redact_query_string = false

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[observability.issues]
enabled = false
