<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1220">
<meta name="description" content="Read the latest women's football news, reports and analysis from WF Pundit.">
<title>Article | WF Pundit</title>

<style>
:root{
  --bg:#0b1220;
  --panel:#131e2e;
  --panel-soft:#101a29;
  --line:#2a3a50;
  --text:#f5f7fb;
  --muted:#b9c6d8;
  --blue:#3978c8;
  --cyan:#a9d3ff;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  line-height:1.65;
  transition:background .25s,color .25s;
}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
.site-header{
  position:sticky;
  top:0;
  z-index:10;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  padding:14px max(18px,calc((100% - 1100px)/2));
  background:rgba(11,18,32,.96);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(14px);
}
.brand{font-size:22px;font-weight:950;letter-spacing:-1px}
.brand span{color:var(--cyan)}
.header-actions{display:flex;align-items:center;gap:10px}
.back-link,.theme-toggle{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:40px;
  padding:8px 13px;
  border:1px solid #526b89;
  border-radius:8px;
  background:#15243a;
  color:#e5effc;
  font-size:12px;
  font-weight:850;
}
.theme-toggle{border-radius:30px}
.page-wrap{width:min(900px,calc(100% - 32px));margin:34px auto 70px}
.article-card{
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:16px;
  background:var(--panel);
  box-shadow:0 16px 40px #0003;
}
.article-inner{padding:clamp(20px,4vw,42px)}
.category{
  display:inline-flex;
  padding:6px 11px;
  border:1px solid #4776a8;
  border-radius:30px;
  background:#3978c82b;
  color:var(--cyan);
  font-size:11px;
  font-weight:950;
  letter-spacing:.09em;
  text-transform:uppercase;
}
h1{
  margin:16px 0 10px;
  font-size:clamp(30px,5vw,48px);
  line-height:1.12;
  letter-spacing:-1.5px;
}
.summary{margin:0;color:var(--muted);font-size:17px}
.byline{
  display:flex;
  flex-wrap:wrap;
  gap:8px 18px;
  margin:19px 0 22px;
  color:var(--muted);
  font-size:12px;
  font-weight:750;
}
.article-image{
  display:block;
  width:100%;
  max-height:560px;
  object-fit:cover;
  background:var(--panel-soft);
}
.article-content{
  color:var(--text);
  font-size:16px;
  line-height:1.9;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.article-actions{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:28px;
  padding-top:22px;
  border-top:1px solid var(--line);
}
.action-button{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:42px;
  padding:9px 15px;
  border:1px solid #54769b;
  border-radius:8px;
  background:#15243a;
  color:#eaf3ff;
  font-size:12px;
  font-weight:900;
}
.action-button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.action-button:disabled{opacity:.6;cursor:wait}
.comments{
  margin-top:25px;
  padding:clamp(20px,4vw,32px);
  border:1px solid var(--line);
  border-radius:16px;
  background:var(--panel);
}
.comments h2{margin:0 0 5px;font-size:25px}
.comments-intro{margin:0 0 20px;color:var(--muted);font-size:13px}
.comment-prompt{
  padding:17px;
  border:1px solid #45688e;
  border-radius:10px;
  background:var(--panel-soft);
}
.comment-prompt p{margin:0 0 12px;color:var(--muted);font-size:14px}
.comment-form label{display:block;margin:0 0 8px;font-size:13px;font-weight:850}
.comment-form textarea{
  display:block;
  width:100%;
  min-height:110px;
  resize:vertical;
  padding:12px;
  border:1px solid #40536c;
  border-radius:8px;
  outline:none;
  background:var(--panel-soft);
  color:var(--text);
  font:inherit;
}
.comment-form textarea:focus{border-color:var(--cyan)}
.comment-form button{margin-top:10px}
.comment-list{display:grid;gap:12px;margin-top:20px}
.comment-item{
  padding:14px;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--panel-soft);
}
.comment-meta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px;margin-bottom:7px}
.comment-name{font-size:13px;font-weight:900}
.comment-date{color:var(--muted);font-size:11px}
.comment-text{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.status-message{padding:14px;color:var(--muted);font-size:13px}
.error-message{color:#ffb5bf}
.modal-backdrop{
  position:fixed;
  inset:0;
  z-index:30;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:#020711c9;
}
.modal-backdrop.open{display:flex}
.login-modal{
  width:min(420px,100%);
  padding:25px;
  border:1px solid #526b89;
  border-radius:15px;
  background:var(--panel);
  box-shadow:0 20px 60px #0008;
}
.login-modal h2{margin:0 0 8px;font-size:23px}
.login-modal p{margin:0 0 18px;color:var(--muted);font-size:14px}
.modal-actions{display:flex;flex-wrap:wrap;gap:9px}
.modal-actions a,.modal-close{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:42px;
  padding:9px 14px;
  border:1px solid #54769b;
  border-radius:8px;
  background:#15243a;
  color:#fff;
  font-size:12px;
  font-weight:900;
}
.modal-actions a.primary{background:var(--blue);border-color:var(--blue)}
.modal-close{margin-top:14px;background:transparent;color:var(--muted)}
[hidden]{display:none!important}
body.light-mode{
  --bg:#f1f4f8;
  --panel:#fff;
  --panel-soft:#f7f9fc;
  --line:#dce3ec;
  --text:#1c2939;
  --muted:#66758a;
}
body.light-mode .site-header{background:rgba(255,255,255,.96)}
body.light-mode .back-link,
body.light-mode .theme-toggle,
body.light-mode .action-button,
body.light-mode .modal-actions a{background:#fff;color:#245d9d;border-color:#a9bfd9}
body.light-mode .action-button.primary,
body.light-mode .modal-actions a.primary{background:#2869b3;color:#fff;border-color:#2869b3}
body.light-mode .comment-form textarea{background:#fff;color:#1c2939;border-color:#cbd5e1}
@media(max-width:600px){
  .site-header{padding:12px 15px}
  .brand{font-size:19px}
  .back-link,.theme-toggle{min-height:37px;padding:7px 10px;font-size:11px}
  .page-wrap{margin-top:20px}
  .summary{font-size:15px}
  .article-content{font-size:15px}
}
</style>
</head>

<body>
<header class="site-header">
  <a class="brand" href="/">WF <span>PUNDIT</span></a>
  <div class="header-actions">
    <a class="back-link" href="/">← HOME</a>
    <button class="theme-toggle" id="themeToggle" type="button">☀️ Light Mode</button>
  </div>
</header>

<main class="page-wrap">
  <article class="article-card">
    <div class="article-inner">
      <div id="articleStatus" class="status-message">Loading article...</div>

      <div id="articleContent" hidden>
        <span class="category" id="articleCategory"></span>
        <h1 id="articleTitle"></h1>
        <p class="summary" id="articleSummary"></p>

        <div class="byline">
          <span id="articleAuthor"></span>
          <span id="articleDate"></span>
        </div>

        <img id="articleImage" class="article-image" alt="" hidden>
        <div class="article-content" id="articleBody"></div>

        <div class="article-actions">
          <button class="action-button primary" id="saveButton" type="button">☆ SAVE ARTICLE</button>
          <a class="action-button" href="/">← BACK TO NEWS</a>
        </div>
      </div>
    </div>
  </article>

  <section class="comments" id="commentsSection" hidden>
    <h2>Comments</h2>
    <p class="comments-intro">Join the conversation about this story.</p>

    <div class="comment-prompt" id="commentLoginPrompt" hidden>
      <p>You need to log in or create an account before you can comment.</p>
      <button class="action-button primary" id="openCommentLogin" type="button">LOG IN / SIGN UP TO COMMENT</button>
    </div>

    <form class="comment-form" id="commentForm" hidden>
      <label for="commentInput">Write a comment</label>
      <textarea id="commentInput" maxlength="2000" required placeholder="Share your thoughts..."></textarea>
      <button class="action-button primary" id="commentSubmit" type="submit">POST COMMENT</button>
    </form>

    <div class="comment-list" id="commentList">
      <div class="status-message">Loading comments...</div>
    </div>
  </section>
</main>

<div class="modal-backdrop" id="loginModal" role="dialog" aria-modal="true" aria-labelledby="loginModalTitle">
  <div class="login-modal">
    <h2 id="loginModalTitle">Join the conversation</h2>
    <p id="loginModalText">Log in or create a free account to continue.</p>

    <div class="modal-actions">
      <a class="primary" id="modalLoginLink" href="/account.html">LOG IN</a>
      <a id="modalRegisterLink" href="/account.html?mode=register">SIGN UP</a>
    </div>

    <button class="modal-close" id="closeLoginModal" type="button">CLOSE</button>
  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const articleId = Number(params.get("id"));

const articleStatus = document.getElementById("articleStatus");
const articleContent = document.getElementById("articleContent");
const commentsSection = document.getElementById("commentsSection");
const commentLoginPrompt = document.getElementById("commentLoginPrompt");
const commentForm = document.getElementById("commentForm");
const commentList = document.getElementById("commentList");
const loginModal = document.getElementById("loginModal");
const saveButton = document.getElementById("saveButton");

let currentUser = null;
let currentArticle = null;function applyTheme(theme) {
  document.body.classList.toggle("light-mode", theme === "light");

  try {
    localStorage.setItem("wf-theme", theme);
  } catch (error) {}
}

try {
  const savedTheme = localStorage.getItem("wf-theme");
  applyTheme(savedTheme === "light" ? "light" : "dark");
} catch (error) {
  applyTheme("dark");
}

if (themeToggle) {
  themeToggle.addEventListener("click", () => {
    const isLight = document.body.classList.contains("light-mode");
    applyTheme(isLight ? "dark" : "light");
  });
}

function showLoginModal(mode = "login") {
  if (!authModal) return;

  authModal.hidden = false;
  authModal.setAttribute("aria-hidden", "false");

  if (modalTitle) {
    modalTitle.textContent =
      mode === "register" ? "Create your account" : "Log in to comment";
  }

  if (modalMessage) {
    modalMessage.textContent = "";
  }

  if (modalEmail) {
    modalEmail.value = "";
  }

  if (modalPassword) {
    modalPassword.value = "";
  }

  if (mode === "register" && modalRegister) {
    modalRegister.hidden = false;
  } else if (modalRegister) {
    modalRegister.hidden = true;
  }
}

function closeLoginModal() {
  if (!authModal) return;

  authModal.hidden = true;
  authModal.setAttribute("aria-hidden", "true");
}

if (closeModal) {
  closeModal.addEventListener("click", closeLoginModal);
}

if (authModal) {
  authModal.addEventListener("click", event => {
    if (event.target === authModal) {
      closeLoginModal();
    }
  });
}

document.addEventListener("keydown", event => {
  if (event.key === "Escape") {
    closeLoginModal();
  }
});

function formatDate(dateValue) {
  if (!dateValue) return "";

  const date = new Date(dateValue);

  if (Number.isNaN(date.getTime())) return "";

  return date.toLocaleDateString(undefined, {
    year: "numeric",
    month: "long",
    day: "numeric"
  });
}

async function readJsonResponse(response) {
  let result;

  try {
    result = await response.json();
  } catch (error) {
    throw new Error("The server returned an invalid response.");
  }

  if (!response.ok || !result.success) {
    throw new Error(
      result.error || "Something went wrong. Please try again."
    );
  }

  return result;
}

async function checkLogin() {
  try {
    const response = await fetch("/api/me", {
      credentials: "same-origin"
    });

    const result = await readJsonResponse(response);

    currentUser = result.loggedIn ? result.user : null;

    if (currentUser) {
      if (loginPrompt) loginPrompt.hidden = true;
      if (commentForm) commentForm.hidden = false;
      if (saveButton) saveButton.hidden = false;
    } else {
      if (loginPrompt) loginPrompt.hidden = false;
      if (commentForm) commentForm.hidden = true;
      if (saveButton) saveButton.hidden = true;
    }
  } catch (error) {
    currentUser = null;

    if (loginPrompt) loginPrompt.hidden = false;
    if (commentForm) commentForm.hidden = true;
    if (saveButton) saveButton.hidden = true;
  }
}

async function loadArticle() {
  if (!articleId) {
    if (articleTitle) articleTitle.textContent = "Article not found";
    if (articleBody) articleBody.textContent =
      "No article was selected. Please return to the homepage.";
    return;
  }

  try {
    const response = await fetch(
      "/api/article?id=" + encodeURIComponent(articleId),
      { credentials: "same-origin" }
    );

    const result = await readJsonResponse(response);
    currentArticle = result.article;

    if (!currentArticle) {
      throw new Error("This article could not be found.");
    }

    if (articleCategory) {
      articleCategory.textContent = currentArticle.category || "Women's Football";
    }

    if (articleTitle) {
      articleTitle.textContent = currentArticle.title || "Untitled article";
    }

    if (articleSummary) {
      articleSummary.textContent = currentArticle.summary || "";
    }

    if (articleAuthor) {
      articleAuthor.textContent = currentArticle.author
        ? "By " + currentArticle.author
        : "";
    }

    if (articleDate) {
      articleDate.textContent = formatDate(currentArticle.created_at);
    }

    if (articleImage) {
      if (currentArticle.image_url) {
        articleImage.src = currentArticle.image_url;
        articleImage.hidden = false;
      } else {
        articleImage.hidden = true;
      }
    }

    if (articleBody) {
      articleBody.textContent = currentArticle.content || "";
    }

    await loadComments();
  } catch (error) {
    if (articleTitle) {
      articleTitle.textContent = "Unable to load article";
    }

    if (articleBody) {
      articleBody.textContent =
        error.message || "Please refresh the page and try again.";
    }
  }
}

async function loadComments() {
  if (!articleId || !commentsList) return;

  commentsList.replaceChildren();

  try {
    const response = await fetch(
      "/api/comments?articleId=" + encodeURIComponent(articleId),
      { credentials: "same-origin" }
    );

    const result = await readJsonResponse(response);
    const comments = result.comments || [];

    if (comments.length === 0) {
      commentsList.textContent = "No comments yet. Be the first to comment.";
      return;
    }

    comments.forEach(item => {
      const commentCard = document.createElement("div");
      commentCard.className = "comment-item";

      const name = document.createElement("strong");
      name.textContent = item.display_name || "Reader";

      const date = document.createElement("small");
      date.textContent = formatDate(item.created_at);

      const content = document.createElement("p");
      content.textContent = item.comment || "";

      commentCard.append(name, date, content);
      commentsList.appendChild(commentCard);
    });
  } catch (error) {
    commentsList.textContent =
      "Comments could not be loaded. Please refresh the page.";
  }
  }// Handle login and registration inside the comment popup.
if (authModal) {
  const modalForms = authModal.querySelectorAll("form");

  modalForms.forEach((form, index) => {
    form.addEventListener("submit", async event => {
      event.preventDefault();

      const isRegister =
        form.id.toLowerCase().includes("register") || index > 0;

      const emailField = form.querySelector('input[type="email"]');
      const passwordField = form.querySelector('input[type="password"]');
      const nameField = form.querySelector(
        'input[name="displayName"], input[name="name"], input[type="text"]'
      );

      const button = form.querySelector('button[type="submit"]');

      if (!emailField || !passwordField) return;

      if (button) {
        button.disabled = true;
        button.textContent = "PLEASE WAIT...";
      }

      try {
        const endpoint = isRegister ? "/api/register" : "/api/login";

        const data = isRegister
          ? {
              displayName: nameField ? nameField.value.trim() : "",
              email: emailField.value.trim(),
              password: passwordField.value
            }
          : {
              email: emailField.value.trim(),
              password: passwordField.value
            };

        const response = await fetch(endpoint, {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });

        const result = await readJsonResponse(response);

        currentUser = result.user;
        closeLoginModal();

        if (loginPrompt) loginPrompt.hidden = true;
        if (commentForm) commentForm.hidden = false;
        if (saveButton) saveButton.hidden = false;

      } catch (error) {
        if (modalMessage) {
          modalMessage.textContent =
            error.message || "Unable to continue. Please try again.";
        }
      } finally {
        if (button) {
          button.disabled = false;
          button.textContent = isRegister ? "CREATE ACCOUNT" : "LOG IN";
        }
      }
    });
  });
}

// Open the login or registration popup from the comment prompt.
if (loginPrompt) {
  loginPrompt.addEventListener("click", event => {
    const clicked = event.target.closest("button, a");

    if (!clicked) return;

    event.preventDefault();

    const text = (clicked.textContent || "").toLowerCase();

    showLoginModal(
      text.includes("sign") || text.includes("register")
        ? "register"
        : "login"
    );
  });
}

// Submit a comment.
if (commentForm) {
  commentForm.addEventListener("submit", async event => {
    event.preventDefault();

    if (!currentUser) {
      showLoginModal("login");
      return;
    }

    const field = commentForm.querySelector(
      'textarea, input[name="comment"], input[type="text"]'
    );

    const comment = field ? field.value.trim() : "";

    if (!comment) return;

    const button = commentForm.querySelector('button[type="submit"]');

    if (button) {
      button.disabled = true;
      button.textContent = "POSTING...";
    }

    try {
      const response = await fetch("/api/comments", {
        method: "POST",
        credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          articleId,
          comment
        })
      });

      await readJsonResponse(response);

      field.value = "";
      await loadComments();

    } catch (error) {
      alert(error.message || "Unable to post your comment.");
    } finally {
      if (button) {
        button.disabled = false;
        button.textContent = "POST COMMENT";
      }
    }
  });
}

// Save the article.
if (saveButton) {
  saveButton.addEventListener("click", async () => {
    if (!currentUser) {
      showLoginModal("login");
      return;
    }

    saveButton.disabled = true;
    saveButton.textContent = "SAVING...";

    try {
      const response = await fetch("/api/saved", {
        method: "POST",
        credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ articleId })
      });

      await readJsonResponse(response);

      saveButton.textContent = "SAVED";

    } catch (error) {
      alert(error.message || "Unable to save this article.");
      saveButton.textContent = "SAVE ARTICLE";
    } finally {
      saveButton.disabled = false;
    }
  });
}

// Load the article and check the reader's login status.
async function initialisePage() {
  await checkLogin();
  await loadArticle();
}

initialisePage();
</script>
</body>
</html>
