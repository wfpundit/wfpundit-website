
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1220">
<meta name="description" content="Read the latest women's football news, reports and analysis from WF Pundit.">
<title>Article | WF Pundit</title>

<style>
:root{
  --bg:#0b1220;
  --panel:#131e2e;
  --panel-soft:#101a29;
  --line:#2a3a50;
  --text:#f5f7fb;
  --muted:#b9c6d8;
  --blue:#3978c8;
  --cyan:#a9d3ff;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  line-height:1.65;
  transition:background .25s,color .25s;
}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
.site-header{
  position:sticky;
  top:0;
  z-index:10;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  padding:14px max(18px,calc((100% - 1100px)/2));
  background:rgba(11,18,32,.96);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(14px);
}
.brand{font-size:22px;font-weight:950;letter-spacing:-1px}
.brand span{color:var(--cyan)}
.header-actions{display:flex;align-items:center;gap:10px}
.back-link,.theme-toggle{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:40px;
  padding:8px 13px;
  border:1px solid #526b89;
  border-radius:8px;
  background:#15243a;
  color:#e5effc;
  font-size:12px;
  font-weight:850;
}
.theme-toggle{border-radius:30px}
.page-wrap{width:min(900px,calc(100% - 32px));margin:34px auto 70px}
.article-card{
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:16px;
  background:var(--panel);
  box-shadow:0 16px 40px #0003;
}
.article-inner{padding:clamp(20px,4vw,42px)}
.category{
  display:inline-flex;
  padding:6px 11px;
  border:1px solid #4776a8;
  border-radius:30px;
  background:#3978c82b;
  color:var(--cyan);
  font-size:11px;
  font-weight:950;
  letter-spacing:.09em;
  text-transform:uppercase;
}
h1{
  margin:16px 0 10px;
  font-size:clamp(30px,5vw,48px);
  line-height:1.12;
  letter-spacing:-1.5px;
}
.summary{margin:0;color:var(--muted);font-size:17px}
.byline{
  display:flex;
  flex-wrap:wrap;
  gap:8px 18px;
  margin:19px 0 22px;
  color:var(--muted);
  font-size:12px;
  font-weight:750;
}
.article-image{
  display:block;
  width:100%;
  max-height:560px;
  object-fit:cover;
  background:var(--panel-soft);
}
.article-content{
  color:var(--text);
  font-size:16px;
  line-height:1.9;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.article-actions{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:28px;
  padding-top:22px;
  border-top:1px solid var(--line);
}
.action-button{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:42px;
  padding:9px 15px;
  border:1px solid #54769b;
  border-radius:8px;
  background:#15243a;
  color:#eaf3ff;
  font-size:12px;
  font-weight:900;
}
.action-button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.action-button:disabled{opacity:.6;cursor:wait}
.comments{
  margin-top:25px;
  padding:clamp(20px,4vw,32px);
  border:1px solid var(--line);
  border-radius:16px;
  background:var(--panel);
}
.comments h2{margin:0 0 5px;font-size:25px}
.comments-intro{margin:0 0 20px;color:var(--muted);font-size:13px}
.comment-prompt{
  padding:17px;
  border:1px solid #45688e;
  border-radius:10px;
  background:var(--panel-soft);
}
.comment-prompt p{margin:0 0 12px;color:var(--muted);font-size:14px}
.comment-form label{display:block;margin:0 0 8px;font-size:13px;font-weight:850}
.comment-form textarea{
  display:block;
  width:100%;
  min-height:110px;
  resize:vertical;
  padding:12px;
  border:1px solid #40536c;
  border-radius:8px;
  outline:none;
  background:var(--panel-soft);
  color:var(--text);
  font:inherit;
}
.comment-form textarea:focus{border-color:var(--cyan)}
.comment-form button{margin-top:10px}
.comment-list{display:grid;gap:12px;margin-top:20px}
.comment-item{
  padding:14px;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--panel-soft);
}
.comment-meta{
  display:flex;
  flex-wrap:wrap;
  justify-content:space-between;
  gap:6px;
  margin-bottom:7px;
}
.comment-name{font-size:13px;font-weight:900}
.comment-date{color:var(--muted);font-size:11px}
.comment-text{
  margin:0;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  font-size:14px;
}
.comment-edit-button{
  margin-top:10px;
  padding:6px 10px;
  border:1px solid #54769b;
  border-radius:6px;
  background:transparent;
  color:var(--cyan);
  font-size:11px;
  font-weight:850;
}
.comment-edit-form{margin-top:10px}
.comment-edit-textarea{
  display:block;
  width:100%;
  min-height:90px;
  padding:10px;
  border:1px solid #40536c;
  border-radius:8px;
  background:var(--panel);
  color:var(--text);
  font:inherit;
  resize:vertical;
}
.comment-edit-actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:9px;
}
.comment-edit-status{margin-top:8px;color:var(--muted);font-size:12px}
.status-message{padding:14px;color:var(--muted);font-size:13px}
.error-message{color:#ffb5bf}.modal-backdrop{
  position:fixed;
  inset:0;
  z-index:30;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:#020711c9;
}
.modal-backdrop.open{display:flex}
.login-modal{
  width:min(420px,100%);
  padding:25px;
  border:1px solid #526b89;
  border-radius:15px;
  background:var(--panel);
  box-shadow:0 20px 60px #0008;
}
.login-modal h2{margin:0 0 8px;font-size:23px}
.login-modal p{margin:0 0 18px;color:var(--muted);font-size:14px}
.modal-actions{display:flex;flex-wrap:wrap;gap:9px}
.modal-actions a,.modal-close{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:42px;
  padding:9px 14px;
  border:1px solid #54769b;
  border-radius:8px;
  background:#15243a;
  color:#fff;
  font-size:12px;
  font-weight:900;
}
.modal-actions a.primary{background:var(--blue);border-color:var(--blue)}
.modal-close{
  margin-top:14px;
  background:transparent;
  color:var(--muted);
}

/* REPLIES AND REACTIONS */
.comment-tools{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-top:12px}
.reaction-button,.reply-toggle{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:6px 10px;border:1px solid #405a78;border-radius:20px;background:#17283d;color:#dcecff;font-size:11px;font-weight:850;transition:transform .18s,border-color .18s,background .18s}
.reaction-button:hover,.reply-toggle:hover{transform:translateY(-1px);border-color:var(--cyan)}
.reaction-button.active{background:#234c78;border-color:#72b8ff;color:#fff;box-shadow:0 3px 12px #3978c833}
.comment-replies{display:grid;gap:9px;margin:13px 0 0 18px;padding-left:14px;border-left:2px solid #42658a}
.reply-item{padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.reply-form{display:grid;gap:8px;margin-top:11px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.reply-form textarea{width:100%;min-height:76px;resize:vertical;padding:10px;border:1px solid #40536c;border-radius:8px;background:var(--panel-soft);color:var(--text);font:inherit}
.reply-form-actions{display:flex;flex-wrap:wrap;gap:8px}
.reply-status{font-size:12px;color:var(--muted)}
body.light-mode .reaction-button,body.light-mode .reply-toggle{background:#fff;color:#245d9d;border-color:#b9cbe0}
body.light-mode .reaction-button.active{background:#e3f1ff;border-color:#6aa4df;color:#174d83}
body.light-mode .reply-form textarea{background:#fff;color:#1c2939;border-color:#cbd5e1}
@media(max-width:480px){.comment-replies{margin-left:8px;padding-left:9px}.reaction-button,.reply-toggle{padding:6px 8px;font-size:10px}}

[hidden]{display:none!important}
body.light-mode{
  --bg:#f1f4f8;
  --panel:#fff;
  --panel-soft:#f7f9fc;
  --line:#dce3ec;
  --text:#1c2939;
  --muted:#66758a;
}
body.light-mode .site-header{background:rgba(255,255,255,.96)}
body.light-mode .back-link,
body.light-mode .theme-toggle,
body.light-mode .action-button,
body.light-mode .modal-actions a{
  background:#fff;
  color:#245d9d;
  border-color:#a9bfd9;
}
body.light-mode .action-button.primary,
body.light-mode .modal-actions a.primary{
  background:#2869b3;
  color:#fff;
  border-color:#2869b3;
}
body.light-mode .comment-form textarea,
body.light-mode .comment-edit-textarea{
  background:#fff;
  color:#1c2939;
  border-color:#cbd5e1;
}
@media(max-width:600px){
  .site-header{padding:12px 15px}
  .brand{font-size:19px}
  .back-link,.theme-toggle{
    min-height:37px;
    padding:7px 10px;
    font-size:11px;
  }
  .page-wrap{margin-top:20px}
  .summary{font-size:15px}
  .article-content{font-size:15px}
}
</style>
</head>

<body>
<header class="site-header">
  <a class="brand" href="/">WF <span>PUNDIT</span></a>
  <div class="header-actions">
    <a class="back-link" href="/">← HOME</a>
    <button class="theme-toggle" id="themeToggle" type="button">☀️ Light Mode</button>
  </div>
</header>

<main class="page-wrap">
  <article class="article-card">
    <div class="article-inner">
      <div id="articleStatus" class="status-message">Loading article...</div>

      <div id="articleContent" hidden>
        <span class="category" id="articleCategory"></span>
        <h1 id="articleTitle"></h1>
        <p class="summary" id="articleSummary"></p>

        <div class="byline">
          <span id="articleAuthor"></span>
          <span id="articleDate"></span>
        </div>

        <img id="articleImage" class="article-image" alt="" hidden>
        <div class="article-content" id="articleBody"></div>

        <div class="article-actions">
          <button class="action-button primary" id="saveButton" type="button">☆ SAVE ARTICLE</button>
          <a class="action-button" href="/">← BACK TO NEWS</a>
        </div>
      </div>
    </div>
  </article>

  <section class="comments" id="commentsSection" hidden>
    <h2>Comments</h2>
    <p class="comments-intro">Join the conversation about this story.</p>

    <div class="comment-prompt" id="commentLoginPrompt" hidden>
      <p>You need to log in or create an account before you can comment.</p>
      <button class="action-button primary" id="openCommentLogin" type="button">
        LOG IN / SIGN UP TO COMMENT
      </button>
    </div>

    <form class="comment-form" id="commentForm" hidden>
      <label for="commentInput">Write a comment</label>
      <textarea id="commentInput" maxlength="2000" required placeholder="Share your thoughts..."></textarea>
      <button class="action-button primary" id="commentSubmit" type="submit">POST COMMENT</button>
    </form>

    <div class="comment-list" id="commentList">
      <div class="status-message">Loading comments...</div>
    </div>
  </section>
</main>

<div class="modal-backdrop" id="loginModal" role="dialog" aria-modal="true" aria-labelledby="loginModalTitle">
  <div class="login-modal">
    <h2 id="loginModalTitle">Join the conversation</h2>
    <p id="loginModalText">Log in or create a free account to continue.</p>

    <div class="modal-actions">
      <a class="primary" id="modalLoginLink" href="/account.html">LOG IN</a>
      <a id="modalRegisterLink" href="/account.html?mode=register">SIGN UP</a>
    </div>

    <button class="modal-close" id="closeLoginModal" type="button">CLOSE</button>
  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const articleId = Number(params.get("id"));

const themeToggle = document.getElementById("themeToggle");
const articleStatus = document.getElementById("articleStatus");
const articleContent = document.getElementById("articleContent");
const commentsSection = document.getElementById("commentsSection");
const articleCategory = document.getElementById("articleCategory");
const articleTitle = document.getElementById("articleTitle");
const articleSummary = document.getElementById("articleSummary");
const articleAuthor = document.getElementById("articleAuthor");
const articleDate = document.getElementById("articleDate");
const articleImage = document.getElementById("articleImage");
const articleBody = document.getElementById("articleBody");
const saveButton = document.getElementById("saveButton");
const commentLoginPrompt = document.getElementById("commentLoginPrompt");
const openCommentLogin = document.getElementById("openCommentLogin");
const commentForm = document.getElementById("commentForm");
const commentInput = document.getElementById("commentInput");
const commentSubmit = document.getElementById("commentSubmit");
const commentList = document.getElementById("commentList");
const loginModal = document.getElementById("loginModal");
const modalLoginLink = document.getElementById("modalLoginLink");
const modalRegisterLink = document.getElementById("modalRegisterLink");
const closeLoginModalButton = document.getElementById("closeLoginModal");

let currentUser = null;

function applyTheme(theme) {
  document.body.classList.toggle("light-mode", theme === "light");

  if (themeToggle) {
    themeToggle.textContent =
      theme === "light" ? "🌙 Dark Mode" : "☀️ Light Mode";
  }

  try {
    localStorage.setItem("wf-theme", theme);
  } catch (error) {}
}

try {
  applyTheme(
    localStorage.getItem("wf-theme") === "light" ? "light" : "dark"
  );
} catch (error) {
  applyTheme("dark");
}

if (themeToggle) {
  themeToggle.addEventListener("click", () => {
    applyTheme(
      document.body.classList.contains("light-mode") ? "dark" : "light"
    );
  });
}

function getReturnUrl() {
  return window.location.pathname +
    window.location.search +
    window.location.hash;
}

function openLoginModal() {
  const returnTo = encodeURIComponent(getReturnUrl());

  modalLoginLink.href =
    "/account.html?mode=login&returnTo=" + returnTo;

  modalRegisterLink.href =
    "/account.html?mode=register&returnTo=" + returnTo;

  loginModal.classList.add("open");
}

function closeLoginModal() {
  loginModal.classList.remove("open");
}

if (openCommentLogin) {
  openCommentLogin.addEventListener("click", openLoginModal);
}

if (closeLoginModalButton) {
  closeLoginModalButton.addEventListener("click", closeLoginModal);
}

if (loginModal) {
  loginModal.addEventListener("click", event => {
    if (event.target === loginModal) {
      closeLoginModal();
    }
  });
}

document.addEventListener("keydown", event => {
  if (event.key === "Escape") {
    closeLoginModal();
  }
});

// Display dates and times using each reader's local time zone.
// SQLite timestamps without a timezone are treated as UTC.
function formatDateTime(value) {
  if (!value) return "";

  let normalized = String(value).trim();

  if (/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$/.test(normalized)) {
    normalized = normalized.replace(" ", "T") + "Z";
  }

  const date = new Date(normalized);

  if (Number.isNaN(date.getTime())) return "";

  return new Intl.DateTimeFormat(undefined, {
    year: "numeric",
    month: "long",
    day: "numeric",
    hour: "2-digit",
    minute: "2-digit",
    hourCycle: "h23"
  }).format(date);
}

async function readJsonResponse(response) {
  let result;

  try {
    result = await response.json();
  } catch (error) {
    throw new Error("The server returned an invalid response.");
  }

  if (!response.ok || !result.success) {
    throw new Error(
      result.error || "Something went wrong. Please try again."
    );
  }

  return result;
}

async function checkLogin() {
  try {
    const response = await fetch("/api/me", {
      credentials: "same-origin"
    });

    const result = await readJsonResponse(response);
    currentUser = result.loggedIn ? result.user : null;

  } catch (error) {
    currentUser = null;
  }

  if (currentUser) {
    commentLoginPrompt.hidden = true;
    commentForm.hidden = false;
    saveButton.hidden = false;
  } else {
    commentLoginPrompt.hidden = false;
    commentForm.hidden = true;
    saveButton.hidden = true;
  }
}

async function loadComments() {
  commentList.replaceChildren();

  try {
    const response = await fetch(
      "/api/comments?articleId=" + encodeURIComponent(articleId),
      { credentials: "same-origin" }
    );
    const result = await readJsonResponse(response);
    const comments = result.comments || [];

    if (!comments.length) {
      const empty = document.createElement("div");
      empty.className = "status-message";
      empty.textContent = "No comments yet. Be the first to comment.";
      commentList.appendChild(empty);
      return;
    }

    const byId = new Map();
    const roots = [];

    comments.forEach(item => {
      item.replies = [];
      byId.set(String(item.id), item);
    });

    comments.forEach(item => {
      const parent = item.parent_comment_id
        ? byId.get(String(item.parent_comment_id))
        : null;
      if (parent) parent.replies.push(item);
      else roots.push(item);
    });

    function makeButton(label, className, onClick) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = className;
      button.textContent = label;
      button.addEventListener("click", onClick);
      return button;
    }

    function renderComment(item, isReply) {
      const card = document.createElement("article");
      card.className = isReply ? "reply-item" : "comment-item";

      const meta = document.createElement("div");
      meta.className = "comment-meta";

      const name = document.createElement("strong");
      name.className = "comment-name";
      name.textContent = item.display_name || "Reader";

      const date = document.createElement("span");
      date.className = "comment-date";
      date.textContent = formatDateTime(item.created_at);
      if (item.edited_at) {
        date.textContent += " · Edited " + formatDateTime(item.edited_at);
      }

      const content = document.createElement("p");
      content.className = "comment-text";
      content.textContent = item.comment || "";
      meta.append(name, date);
      card.append(meta, content);

      if (item.is_own) {
        const editButton = makeButton("EDIT COMMENT", "comment-edit-button", () => {
          editButton.hidden = true;
          content.hidden = true;

          const form = document.createElement("form");
          form.className = "comment-edit-form";

          const textarea = document.createElement("textarea");
          textarea.className = "comment-edit-textarea";
          textarea.maxLength = 2000;
          textarea.required = true;
          textarea.value = item.comment || "";

          const actions = document.createElement("div");
          actions.className = "comment-edit-actions";

          const save = document.createElement("button");
          save.type = "submit";
          save.className = "action-button primary";
          save.textContent = "SAVE CHANGES";

          const cancel = makeButton("CANCEL", "action-button", () => {
            form.remove();
            content.hidden = false;
            editButton.hidden = false;
          });

          const status = document.createElement("div");
          status.className = "comment-edit-status";
          actions.append(save, cancel);
          form.append(textarea, actions, status);
          card.appendChild(form);

          form.addEventListener("submit", async event => {
            event.preventDefault();
            const updated = textarea.value.trim();

            if (!updated) {
              status.textContent = "Please write a comment.";
              textarea.focus();
              return;
            }

            save.disabled = true;
            cancel.disabled = true;
            save.textContent = "SAVING...";

            try {
              const res = await fetch("/api/comments", {
                method: "POST",
                credentials: "same-origin",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  action: "edit",
                  commentId: item.id,
                  comment: updated
                })
              });
              await readJsonResponse(res);
              await loadComments();
            } catch (error) {
              status.textContent = error.message || "Unable to update your comment.";
              save.disabled = false;
              cancel.disabled = false;
              save.textContent = "SAVE CHANGES";
            }
          });
        });

        const deleteButton = makeButton("DELETE COMMENT", "comment-edit-button", async () => {
          if (!window.confirm("Are you sure you want to delete this comment?")) return;

          deleteButton.disabled = true;
          deleteButton.textContent = "DELETING...";

          try {
            const res = await fetch("/api/comments", {
              method: "POST",
              credentials: "same-origin",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ action: "delete", commentId: item.id })
            });
            await readJsonResponse(res);
            await loadComments();
          } catch (error) {
            deleteButton.disabled = false;
            deleteButton.textContent = "DELETE COMMENT";
            alert(error.message || "Unable to delete your comment.");
          }
        });

        deleteButton.style.color = "#e05252";
        deleteButton.style.borderColor = "#a44";
        card.append(editButton, deleteButton);
      }

      const tools = document.createElement("div");
      tools.className = "comment-tools";

      const counts = item.reaction_counts || {};
      const reactions = [
        ["like", "👍 Like"],
        ["love", "❤️ Love"],
        ["laugh", "😂 Laugh"],
        ["support", "🙌 Support"]
      ];

      reactions.forEach(([key, label]) => {
        const active = item.my_reaction === key;
        const button = makeButton(
          label + " " + Number(counts[key] || 0),
          "reaction-button" + (active ? " active" : ""),
          async () => {
            if (!currentUser) {
              openLoginModal();
              return;
            }

            button.disabled = true;
            try {
              const res = await fetch("/api/comments", {
                method: "POST",
                credentials: "same-origin",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  action: "react",
                  commentId: item.id,
                  reaction: active ? "remove" : key
                })
              });
              await readJsonResponse(res);
              await loadComments();
            } catch (error) {
              alert(error.message || "Unable to save your reaction.");
              button.disabled = false;
            }
          }
        );

        if (active) button.setAttribute("aria-pressed", "true");
        tools.appendChild(button);
      });

      if (!isReply) {
        const replyButton = makeButton("↩ REPLY", "reply-toggle", () => {
          if (!currentUser) {
            openLoginModal();
            return;
          }

          const existing = card.querySelector(".reply-form");
          if (existing) {
            existing.remove();
            return;
          }

          const form = document.createElement("form");
          form.className = "reply-form";

          const textarea = document.createElement("textarea");
          textarea.maxLength = 2000;
          textarea.required = true;
          textarea.placeholder = "Write a reply...";

          const actions = document.createElement("div");
          actions.className = "reply-form-actions";

          const send = document.createElement("button");
          send.type = "submit";
          send.className = "action-button primary";
          send.textContent = "POST REPLY";

          const cancel = makeButton("CANCEL", "action-button", () => form.remove());
          const status = document.createElement("div");
          status.className = "reply-status";

          actions.append(send, cancel);
          form.append(textarea, actions, status);
          card.appendChild(form);

          form.addEventListener("submit", async event => {
            event.preventDefault();
            const reply = textarea.value.trim();

            if (!reply) {
              textarea.focus();
              return;
            }

            send.disabled = true;
            cancel.disabled = true;
            send.textContent = "POSTING...";

            try {
              const res = await fetch("/api/comments", {
                method: "POST",
                credentials: "same-origin",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  action: "reply",
                  articleId,
                  parentCommentId: item.id,
                  comment: reply
                })
              });
              await readJsonResponse(res);
              await loadComments();
            } catch (error) {
              status.textContent = error.message || "Unable to post your reply.";
              send.disabled = false;
              cancel.disabled = false;
              send.textContent = "POST REPLY";
            }
          });
        });

        tools.appendChild(replyButton);
      }

      card.appendChild(tools);

      if (item.replies && item.replies.length) {
        const replies = document.createElement("div");
        replies.className = "comment-replies";
        item.replies.forEach(reply => {
          replies.appendChild(renderComment(reply, true));
        });
        card.appendChild(replies);
      }

      return card;
    }

    roots.forEach(item => {
      commentList.appendChild(renderComment(item, false));
    });

  } catch (error) {
    const message = document.createElement("div");
    message.className = "status-message error-message";
    message.textContent = error.message || "Comments could not be loaded.";
    commentList.appendChild(message);
  }
}

async function loadArticle() {
  if (!Number.isInteger(articleId) || articleId < 1) {
    articleStatus.textContent =
      "No article was selected. Please return to the homepage.";
    articleStatus.classList.add("error-message");
    return;
  }

  try {
    const response = await fetch(
      "/api/article?id=" + encodeURIComponent(articleId),
      { credentials: "same-origin" }
    );

    const result = await readJsonResponse(response);
    const article = result.article;

    if (!article) {
      throw new Error("This article could not be found.");
    }

    articleCategory.textContent =
      article.category || "Women's Football";

    articleTitle.textContent =
      article.title || "Untitled article";

    articleSummary.textContent =
      article.summary || "";

    articleAuthor.textContent =
      article.author ? "By " + article.author : "";

    articleDate.textContent =
      formatDateTime(article.created_at);

    articleBody.textContent =
      article.content || "";

    if (article.image_url) {
      articleImage.src = article.image_url;
      articleImage.alt = article.title || "Article image";
      articleImage.hidden = false;
    } else {
      articleImage.hidden = true;
      articleImage.removeAttribute("src");
    }

    articleStatus.hidden = true;
    articleContent.hidden = false;
    commentsSection.hidden = false;

    await loadComments();

  } catch (error) {
    articleStatus.textContent =
      error.message ||
      "Unable to load this article. Please refresh the page.";

    articleStatus.classList.add("error-message");
  }
}

if (commentForm) {
  commentForm.addEventListener("submit", async event => {
    event.preventDefault();

    if (!currentUser) {
      openLoginModal();
      return;
    }

    const comment = commentInput.value.trim();

    if (!comment) {
      commentInput.focus();
      return;
    }

    commentSubmit.disabled = true;
    commentSubmit.textContent = "POSTING...";

    try {
      const response = await fetch("/api/comments", {
        method: "POST",
        credentials: "same-origin",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          articleId,
          comment
        })
      });

      await readJsonResponse(response);

      commentInput.value = "";
      await loadComments();

    } catch (error) {
      alert(error.message || "Unable to post your comment.");

    } finally {
      commentSubmit.disabled = false;
      commentSubmit.textContent = "POST COMMENT";
    }
  });
}

if (saveButton) {
  saveButton.addEventListener("click", async () => {
    if (!currentUser) {
      openLoginModal();
      return;
    }

    saveButton.disabled = true;
    saveButton.textContent = "SAVING...";

    try {
      const response = await fetch("/api/saved", {
        method: "POST",
        credentials: "same-origin",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ articleId })
      });

      await readJsonResponse(response);
      saveButton.textContent = "✓ SAVED";

    } catch (error) {
      alert(error.message || "Unable to save this article.");
      saveButton.textContent = "☆ SAVE ARTICLE";

    } finally {
      saveButton.disabled = false;
    }
  });
}

async function initialisePage() {
  await checkLogin();
  await loadArticle();
}

initialisePage();
</script>
</body>
</html>
