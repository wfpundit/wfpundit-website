
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WF Pundit | Admin Dashboard</title>

<style>
:root {
  --bg: #101522;
  --panel: #192235;
  --text: #f4f6fb;
  --muted: #aab4c5;
  --border: #303d54;
  --accent: #1769e8;
  --danger: #d93649;
}
body.light {
  --bg: #f3f5f9;
  --panel: #ffffff;
  --text: #172033;
  --muted: #667085;
  --border: #dce2ec;
  --accent: #1769e8;
  --danger: #d93649;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 20px;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
}
.container { max-width: 1050px; margin: auto; }
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 22px;
}
h1 { font-size: 25px; margin: 0; }
h2 { font-size: 19px; margin-top: 0; }
.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 20px;
}
label {
  display: block;
  margin: 15px 0 7px;
  font-weight: bold;
  font-size: 14px;
}
input, textarea, select {
  width: 100%;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: var(--bg);
  color: var(--text);
  font: inherit;
}
textarea { min-height: 110px; resize: vertical; }
button {
  border: 0;
  border-radius: 7px;
  padding: 11px 15px;
  background: var(--accent);
  color: white;
  font-weight: bold;
  cursor: pointer;
}
button:disabled { opacity: .55; cursor: wait; }
button.secondary { background: #586579; }
button.danger { background: var(--danger); }
button.small { padding: 8px 11px; font-size: 13px; }
.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  margin-top: 15px;
}
.muted { color: var(--muted); font-size: 13px; }
#message { margin: 12px 0; font-size: 14px; }
.article {
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 14px;
  margin-top: 12px;
}
.article h3 { margin: 0 0 8px; font-size: 16px; }
.article-meta {
  color: var(--muted);
  font-size: 13px;
  margin-bottom: 12px;
}
.article img {
  width: 100%;
  max-height: 180px;
  object-fit: cover;
  border-radius: 7px;
  margin: 8px 0;
}
#preview {
  display: none;
  max-width: 100%;
  max-height: 220px;
  margin-top: 12px;
  border-radius: 8px;
}
.hidden { display: none !important; }
@media (max-width: 600px) {
  body { padding: 12px; }
  .panel { padding: 15px; }
}
</style>
</head>

<body>
<div class="container">

<header>
  <h1>WF Pundit Admin</h1>
  <button type="button" class="secondary" id="themeButton">
    Toggle Theme
  </button>
</header>

<section class="panel">
  <h2>Admin Access</h2>
  <label for="adminToken">Admin Token</label>
  <input id="adminToken" type="password" placeholder="Enter your admin token">
  <div class="actions">
    <button type="button" id="loadButton">Load Articles</button>
  </div>
  <p class="muted">Your token is used for authenticated admin requests.</p>
</section>

<section class="panel">
  <h2 id="formHeading">Create New Article</h2>

  <form id="articleForm">
    <input type="hidden" id="articleId">

    <label for="title">Article Title</label>
    <input id="title" required>

    <label for="summary">Summary</label>
    <textarea id="summary"></textarea>

    <label for="content">Article Content</label>
    <textarea id="content" rows="9"></textarea>

    <label for="category">Main Category</label>
    <select id="category" required>
      <option value="Latest News">Latest News</option>
      <option value="Women's Leagues">Women's Leagues</option>
      <option value="Transfers">Transfers</option>
      <option value="Women's Champions League (UWCL)">Women's Champions League (UWCL)</option>
      <option value="International Football">International Football</option>
      <option value="Interviews & Features">Interviews & Features</option>
      <option value="Match Reports & Analysis">Match Reports & Analysis</option>
    </select>

    <label for="subcategory">League / Competition Subcategory</label>
    <select id="subcategory">
      <option value="">No subcategory</option>
    </select>

    <label for="author">Author</label>
    <input id="author" value="WF Pundit">

    <label for="status">Article Status</label>
    <select id="status">
      <option value="draft">Draft</option>
      <option value="published">Published</option>
    </select>

    <label for="photo">Upload Article Photo</label>
    <input id="photo" type="file" accept="image/jpeg,image/png,image/webp,image/gif">

    <div class="actions">
      <button type="button" id="uploadButton">Upload Photo</button>
    </div>

    <img id="preview" alt="Article image preview">

    <label for="imageUrl">Featured Image URL</label>
    <input id="imageUrl" type="url" placeholder="Uploaded image URL">

    <div class="actions">
      <button type="submit" id="saveButton">Publish / Save Article</button>
      <button type="button" class="secondary hidden" id="cancelButton">
        Cancel Edit
      </button>
    </div>
  </form>

  <div id="message" role="status"></div>
</section>

<section class="panel">
  <h2>Manage Articles</h2>
  <p class="muted">Published articles and drafts will appear here.</p>
  <div id="articleList">Tap Load Articles to display your articles.</div>
</section>

</div>

<script>
const $ = id => document.getElementById(id);

const category = $("category");
const subcategory = $("subcategory");
const form = $("articleForm");
const message = $("message");

const subcategories = {
  "Women's Leagues": [
    "Women's Super League (WSL)",
    "Bundesliga Women",
    "Liga F",
    "Serie A Women",
    "Première Ligue",
    "NWSL",
    "A-League Women",
    "Women's Championship",
    "Liga MX Femenil",
    "WE League",
    "Damallsvenskan",
    "Toppserien"
  ],
  "International Football": [
    "FIFA Women's World Cup",
    "Women's Africa Cup of Nations (WAFCON)",
    "UEFA Women's Euros",
    "Olympic Women's Football",
    "AFC Women's Asian Cup",
    "Copa América Femenina",
    "UEFA Women's Nations League"
  ]
};

function updateSubcategories(selected = "") {
  subcategory.innerHTML = '<option value="">No subcategory</option>';

  (subcategories[category.value] || []).forEach(item => {
    const option = document.createElement("option");
    option.value = item;
    option.textContent = item;
    subcategory.appendChild(option);
  });

  if (selected) subcategory.value = selected;
}

category.addEventListener("change", () => updateSubcategories());

function getToken() {
  return $("adminToken").value.trim();
}

function authHeaders() {
  return { "Authorization": "Bearer " + getToken() };
}

function showMessage(text, isError = false) {
  message.textContent = text;
  message.style.color = isError ? "#ff6677" : "#35c98a";
}

function setPreview(url) {
  const preview = $("preview");
  if (url) {
    preview.src = url;
    preview.style.display = "block";
  } else {
    preview.removeAttribute("src");
    preview.style.display = "none";
  }
}

$("imageUrl").addEventListener("input", () => {
  setPreview($("imageUrl").value.trim());
});

$("photo").addEventListener("change", () => {
  const file = $("photo").files[0];
  if (file) {
    setPreview(URL.createObjectURL(file));
  }
});

$("uploadButton").addEventListener("click", async () => {
  if (!getToken()) {
    showMessage("Enter your admin token first.", true);
    return;
  }

  const file = $("photo").files[0];

  if (!file) {
    showMessage("Choose a photo first.", true);
    return;
  }

  const button = $("uploadButton");
  button.disabled = true;
  showMessage("Uploading photo...");

  try {
    const data = new FormData();
    data.append("photo", file);

    const response = await fetch("/api/upload-image", {
      method: "POST",
      headers: authHeaders(),
      body: data
    });

    const result = await response.json();

    if (!response.ok || !result.success) {
      throw new Error(result.error || "Photo upload failed.");
    }

    const uploadedUrl = result.image_url || result.url;

    if (!uploadedUrl) {
      throw new Error("Upload response did not contain an image URL.");
    }

    $("imageUrl").value = uploadedUrl;
    setPreview(uploadedUrl);
    showMessage("Photo uploaded successfully.");

  } catch (error) {
    showMessage(error.message, true);
  } finally {
    button.disabled = false;
  }
});

function resetForm() {
  form.reset();
  $("articleId").value = "";
  $("author").value = "WF Pundit";
  $("formHeading").textContent = "Create New Article";
  $("saveButton").textContent = "Publish / Save Article";
  $("cancelButton").classList.add("hidden");
  setPreview("");
  updateSubcategories();
}

$("cancelButton").addEventListener("click", () => {
  resetForm();
  showMessage("Editing cancelled.");
});

form.addEventListener("submit", async event => {
  event.preventDefault();

  if (!getToken()) {
    showMessage("Enter your admin token first.", true);
    return;
  }

  const id = $("articleId").value;

  const selectedCategory = subcategory.value || category.value;

  const article = {
    title: $("title").value.trim(),
    summary: $("summary").value,
    content: $("content").value,
    image_url: $("imageUrl").value.trim(),
    category: selectedCategory,
    author: $("author").value.trim() || "WF Pundit",
    status: $("status").value
  };

  if (!article.title) {
    showMessage("Article title is required.", true);
    return;
  }

  const button = $("saveButton");
  button.disabled = true;
  showMessage(id ? "Updating article..." : "Creating article...");

  try {
    const response = await fetch("/api/admin/articles", {
      method: id ? "PUT" : "POST",
      headers: {
        ...authHeaders(),
        "Content-Type": "application/json"
      },
      body: JSON.stringify(id ? { ...article, id: Number(id) } : article)
    });

    const result = await response.json();

    if (!response.ok || !result.success) {
      throw new Error(result.error || "Unable to save article.");
    }

    showMessage(id ? "Article updated successfully." : "Article created successfully.");
    resetForm();
    await loadArticles();

  } catch (error) {
    showMessage(error.message, true);
  } finally {
    button.disabled = false;
  }
});

async function loadArticles() {
  if (!getToken()) {
    showMessage("Enter your admin token first.", true);
    return;
  }

  $("articleList").textContent = "Loading articles...";

  try {
    const response = await fetch("/api/admin/articles", {
      method: "GET",
      headers: authHeaders()
    });

    const result = await response.json();

    if (!response.ok || !result.success) {
      throw new Error(result.error || "Unable to load articles.");
    }

    displayArticles(result.articles || []);
    showMessage("Articles loaded.");

  } catch (error) {
    $("articleList").textContent = error.message;
    showMessage(error.message, true);
  }
}

function displayArticles(articles) {
  const list = $("articleList");
  list.innerHTML = "";

  if (!articles.length) {
    list.textContent = "No articles found.";
    return;
  }

  articles.forEach(article => {
    const card = document.createElement("div");
    card.className = "article";

    const title = document.createElement("h3");
    title.textContent = article.title || "Untitled article";

    const meta = document.createElement("div");
    meta.className = "article-meta";
    meta.textContent =
      "ID: " + article.id +
      " | " + (article.status || "draft") +
      " | " + (article.category || "Uncategorised");

    card.appendChild(title);
    card.appendChild(meta);

    if (article.image_url && /^https:\/\//i.test(article.image_url)) {
      const img = document.createElement("img");
      img.src = article.image_url;
      img.alt = article.title || "Article photo";
      img.loading = "lazy";
      card.appendChild(img);
    }

    const editButton = document.createElement("button");
    editButton.className = "small";
    editButton.textContent = "Edit";
    editButton.addEventListener("click", () => editArticle(article));

    const deleteButton = document.createElement("button");
    deleteButton.className = "small danger";
    deleteButton.textContent = "Delete";
    deleteButton.addEventListener("click", () => deleteArticle(article.id, article.title));

    const actions = document.createElement("div");
    actions.className = "actions";
    actions.append(editButton, deleteButton);
    card.appendChild(actions);

    list.appendChild(card);
  });
}

function editArticle(article) {
  $("articleId").value = article.id;
  $("title").value = article.title || "";
  $("summary").value = article.summary || "";
  $("content").value = article.content || "";
  $("author").value = article.author || "WF Pundit";
  $("status").value = article.status || "draft";
  $("imageUrl").value = article.image_url || "";

  const knownCategories = [
    "Latest News",
    "Women's Leagues",
    "Transfers",
    "Women's Champions League (UWCL)",
    "International Football",
    "Interviews & Features",
    "Match Reports & Analysis"
  ];

  if (knownCategories.includes(article.category)) {
    category.value = article.category;
    updateSubcategories();
  } else {
    const leagueCategory = subcategories["Women's Leagues"] || [];
    const internationalCategory = subcategories["International Football"] || [];

    if (leagueCategory.includes(article.category)) {
      category.value = "Women's Leagues";
      updateSubcategories(article.category);
    } else if (internationalCategory.includes(article.category)) {
      category.value = "International Football";
      updateSubcategories(article.category);
    } else {
      category.value = "Latest News";
      updateSubcategories();
    }
  }

  setPreview(article.image_url || "");
  $("formHeading").textContent = "Edit Article #" + article.id;
  $("saveButton").textContent = "Update Article";
  $("cancelButton").classList.remove("hidden");

  window.scrollTo({ top: 0, behavior: "smooth" });
  showMessage("Editing article #" + article.id);
}

async function deleteArticle(id, title) {
  if (!confirm('Are you sure you want to delete "' + title + '"? This cannot be undone.')) {
    return;
  }

  try {
    const response = await fetch("/api/admin/articles", {
      method: "DELETE",
      headers: {
        ...authHeaders(),
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ id })
    });

    const result = await response.json();

    if (!response.ok || !result.success) {
      throw new Error(result.error || "Unable to delete article.");
    }

    showMessage("Article deleted.");
    await loadArticles();

  } catch (error) {
    showMessage(error.message, true);
  }
}

$("loadButton").addEventListener("click", loadArticles);

$("themeButton").addEventListener("click", () => {
  document.body.classList.toggle("light");
  localStorage.setItem(
    "wf-theme",
    document.body.classList.contains("light") ? "light" : "dark"
  );
});

if (localStorage.getItem("wf-theme") === "light") {
  document.body.classList.add("light");
}

updateSubcategories();
</script>
</body>
</html>
