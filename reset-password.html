<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1220">
<title>Reset Password | WF Pundit</title>
<style>
:root{--bg:#0b1220;--panel:#131e2e;--line:#2a3a50;--text:#f5f7fb;--muted:#b9c6d8;--blue:#3978c8;--cyan:#a9d3ff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:24px 16px;display:grid;place-items:center;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{width:min(480px,100%)}
.brand{text-align:center;margin-bottom:25px;font-size:30px;font-weight:950;letter-spacing:-1px}
.brand span{color:var(--cyan)}
.card{padding:28px;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 45px #0005}
h1{margin:0 0 8px;font-size:25px}
p{color:var(--muted);font-size:14px;line-height:1.6}
label{display:block;margin:16px 0 7px;font-size:12px;font-weight:800;color:#dce8f7}
input{width:100%;padding:13px;border:1px solid #40536c;border-radius:8px;outline:none;background:#0b1626;color:white}
input:focus{border-color:var(--cyan)}
button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:8px;background:linear-gradient(135deg,#4389d9,#2865aa);color:white;font-weight:900;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.message{display:none;margin-top:16px;padding:11px;border-radius:8px;font-size:13px;overflow-wrap:anywhere}
.message.show{display:block}
.message.error{background:#6b202c;color:#ffe2e6}
.message.success{background:#174b39;color:#d8ffed}
a{display:block;margin-top:20px;text-align:center;color:var(--cyan);font-size:13px;text-decoration:none}
[hidden]{display:none!important}
@media(max-width:600px){.card{padding:20px}}
</style>
</head>
<body>
<main class="wrap">
  <div class="brand">WF <span>PUNDIT</span></div>
  <section class="card">
    <h1>Choose a new password</h1>
    <p>Use a password between 12 and 128 characters. This one-time link lets you set up email-and-password sign-in or reset an existing password. Google sign-in will continue to work.</p>
    <form id="resetForm">
      <label for="newPassword">New password</label>
      <input id="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
      <label for="confirmPassword">Confirm new password</label>
      <input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
      <button type="submit">RESET PASSWORD</button>
    </form>
    <div id="message" class="message" role="status" aria-live="polite"></div>
    <a href="/account.html">← Back to WF Pundit login</a>
  </section>
</main>
<script>
const params = new URLSearchParams(window.location.search);
const token = params.get("token") || "";
const form = document.getElementById("resetForm");
const message = document.getElementById("message");

function showMessage(text, type) {
  message.textContent = text;
  message.className = "message show " + type;
}

if (!token || token.length > 200) {
  form.hidden = true;
  showMessage("This reset link is invalid. Please request a new one from the login page.", "error");
}

form.addEventListener("submit", async event => {
  event.preventDefault();
  const password = document.getElementById("newPassword").value;
  const confirmation = document.getElementById("confirmPassword").value;
  if (password !== confirmation) {
    showMessage("Your passwords do not match.", "error");
    return;
  }

  const button = form.querySelector("button");
  button.disabled = true;
  button.textContent = "PLEASE WAIT...";
  message.className = "message";

  try {
    const response = await fetch("/api/reset-password", {
      method: "POST",
      credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token, password })
    });
    const result = await response.json();
    if (!response.ok || !result.success) {
      throw new Error(result.error || "We couldn't reset your password. Please try again.");
    }
    form.hidden = true;
    showMessage(result.message || "Your password has been reset. You can now log in.", "success");
  } catch (error) {
    showMessage(error.message || "We couldn't reset your password. Please try again.", "error");
  } finally {
    button.disabled = false;
    button.textContent = "RESET PASSWORD";
  }
});
</script>
</body>
</html>
